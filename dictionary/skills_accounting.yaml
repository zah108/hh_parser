# =============================================================
# Словарь навыков для профессии «Бухгалтер» (стартовый)
# Собран по пробному прогону 20 вакансий hh.ru (ноябрь 2026)
# + доменные знания. Расширяйте по мере необходимости.
#
# Подключение:
#   в config.yaml:  skills_file: "dictionary/skills_accounting.yaml"
#                   skills_mode: "replace"
#   или запуском:   python main.py -p "Бухгалтер" --skills-file dictionary/skills_accounting.yaml
#
# Правила:
#   - ключ — фраза как встречается в тексте, в нижнем регистре (латиница/кириллица важны);
